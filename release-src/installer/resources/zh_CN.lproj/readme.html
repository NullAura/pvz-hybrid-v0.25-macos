<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system; line-height: 1.55; color: #202124; }
    h2 { font-size: 17px; margin: 16px 0 5px; }
    code { font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <h2>系统要求</h2>
  <p>macOS 13 或更高版本，约 1.5 GB 可用磁盘空间。</p>
  <h2>运行方式</h2>
  <p>安装完成后，打开“应用程序”文件夹，双击“植物大战僵尸杂交版v0.25”。</p>
  <h2>运行环境</h2>
  <p>游戏自带 Godot 与 .NET 运行环境，不依赖 CrossOver。Apple 芯片通过
  Rosetta 2 运行游戏核心；Intel Mac 可直接运行。</p>
  <h2>存档</h2>
  <p>存档位于 <code>~/Library/Application Support/Godot/app_userdata/植物大战僵尸杂交版/</code>。
  重新安装应用不会删除此目录。</p>
</body>
</html>
